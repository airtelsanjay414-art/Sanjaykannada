<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Happy Kids Car Race</title>
<style>
  :root{
    --sky:#7ed6ff;
    --grass:#6fd35f;
    --road:#545b66;
    --line:#fff7a8;
    --panel:rgba(255,255,255,.90);
    --text:#16324f;
    --accent:#ff6b6b;
    --accent2:#4dabf7;
    --gold:#ffd43b;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    height:100%;
    font-family: "Trebuchet MS", system-ui, sans-serif;
    background: linear-gradient(#7ed6ff 0 55%, #8be36b 55%);
    color:var(--text);
    overflow:hidden;
    touch-action:none;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
  }
  .game-shell{
    width:min(100vw, 520px);
    height:min(100vh, 920px);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--panel);
    padding:8px 10px;
    border-radius:18px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    font-weight:800;
  }
  .brand{
    font-size:clamp(16px,3.8vw,22px);
    white-space:nowrap;
  }
  .stats{
    display:flex;
    gap:8px;
    font-size:clamp(12px,3vw,15px);
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .pill{
    background:#fff;
    padding:5px 8px;
    border-radius:999px;
    box-shadow:inset 0 0 0 2px rgba(22,50,79,.08);
  }
  .game-wrap{
    position:relative;
    flex:1;
    min-height:0;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    background:#9ee57d;
    border:4px solid rgba(255,255,255,.7);
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
    background:#8edc74;
  }
  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(17,40,65,.20);
    backdrop-filter: blur(4px);
    z-index:4;
  }
  .card{
    width:min(88%, 390px);
    padding:22px 18px;
    border-radius:24px;
    background:rgba(255,255,255,.96);
    box-shadow:0 16px 40px rgba(0,0,0,.18);
    text-align:center;
  }
  .card h1,.card h2{margin:0 0 8px}
  .card h1{font-size:clamp(26px,7vw,38px)}
  .card p{margin:8px 0 14px; line-height:1.35}
  .difficulty{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:12px 0 16px;
  }
  .difficulty button,
  .btn{
    border:none;
    border-radius:16px;
    padding:12px 10px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.12);
    transition:.15s transform,.15s box-shadow;
  }
  .difficulty button:active,.btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 rgba(0,0,0,.12);
  }
  .difficulty button{
    background:#e9f5ff;
    color:#174a73;
  }
  .difficulty button.active{
    background:#4dabf7;
    color:white;
  }
  .btn.primary{
    width:100%;
    background:linear-gradient(135deg,#ff7b7b,#ff4d6d);
    color:#fff;
    font-size:20px;
    padding:15px;
  }
  .btn.secondary{
    background:#fff;
    color:#17324e;
  }
  .hidden{display:none!important}
  .pause-badge{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:3;
    background:rgba(255,255,255,.92);
    padding:7px 12px;
    border-radius:999px;
    font-weight:900;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
  }
  .controls{
    display:grid;
    grid-template-columns:1fr auto auto 1fr;
    gap:8px;
    align-items:center;
  }
  .ctrl{
    border:none;
    border-radius:22px;
    min-height:62px;
    font-size:30px;
    font-weight:900;
    background:#fff;
    color:#17324e;
    box-shadow:0 6px 0 rgba(0,0,0,.14);
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
  }
  .ctrl:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.14)}
  .mini{
    min-width:58px;
    font-size:22px;
    background:#fffdf0;
  }
  .sound-on{background:#fff3bf}
  .help{
    text-align:center;
    font-size:12px;
    color:#244760;
    font-weight:700;
    background:rgba(255,255,255,.72);
    border-radius:12px;
    padding:4px 8px;
  }
  @media (max-height:700px){
    .topbar{padding:5px 8px}
    .ctrl{min-height:52px}
    .help{display:none}
  }
</style>
</head>
<body>
<div class="game-shell">
  <div class="topbar">
    <div class="brand">🚗 Happy Kids Car Race</div>
    <div class="stats">
      <div class="pill">⭐ <span id="score">0</span></div>
      <div class="pill">🏆 <span id="highScore">0</span></div>
      <div class="pill">❤️ <span id="lives">3</span></div>
    </div>
  </div>

  <div class="game-wrap">
    <canvas id="game"></canvas>
    <div id="pauseBadge" class="pause-badge hidden">⏸ Paused</div>

    <div id="startOverlay" class="overlay">
      <div class="card">
        <h1>🏁 Ready to Race?</h1>
        <p>Collect ⭐ stars, 🪙 coins and 🎁 gifts.<br>Avoid 🚧 cones, 🪨 rocks and other cars.</p>
        <strong>Choose difficulty</strong>
        <div class="difficulty">
          <button data-level="easy" class="active">Easy</button>
          <button data-level="medium">Medium</button>
          <button data-level="hard">Hard</button>
        </div>
        <button id="startBtn" class="btn primary">▶ Start Race</button>
      </div>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <div class="card">
        <h2>🎉 Great Racing!</h2>
        <p>Your score: <strong id="finalScore">0</strong><br>
           Best score: <strong id="finalHigh">0</strong></p>
        <button id="restartBtn" class="btn primary">🔄 Play Again</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="leftBtn" class="ctrl">⬅️</button>
    <button id="pauseBtn" class="ctrl mini">⏸</button>
    <button id="soundBtn" class="ctrl mini sound-on">🔊</button>
    <button id="rightBtn" class="ctrl">➡️</button>
  </div>
  <div class="help">Keyboard: ← → to move • Space to pause</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('highScore');
  const livesEl = document.getElementById('lives');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const pauseBadge = document.getElementById('pauseBadge');
  const finalScoreEl = document.getElementById('finalScore');
  const finalHighEl = document.getElementById('finalHigh');

  let W=0,H=0,scale=1;
  let running=false, paused=false, soundOn=true;
  let last=0, roadOffset=0, spawnTimer=0, collectibleTimer=0;
  let score=0, lives=3, difficulty='easy', highScore=Number(localStorage.getItem('happyKidsRaceHigh')||0);
  highEl.textContent=highScore;

  const config={
    easy:{speed:180, spawn:1.45, collect:.95, enemySpeed:0.85},
    medium:{speed:230, spawn:1.1, collect:.8, enemySpeed:1},
    hard:{speed:285, spawn:.82, collect:.68, enemySpeed:1.18}
  };

  const player={x:0,y:0,w:54,h:88,targetX:0,color:'#ff5d73',inv:0};
  const objects=[];
  const particles=[];
  const keys={left:false,right:false};

  let audioCtx=null;
  function beep(freq=440,dur=.08,type='sine',vol=.04){
    if(!soundOn) return;
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.value=vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
      o.stop(audioCtx.currentTime+dur);
    }catch(e){}
  }
  function cheer(){
    beep(660,.09,'triangle',.045);
    setTimeout(()=>beep(880,.12,'triangle',.04),80);
  }

  function resize(){
    const rect=canvas.getBoundingClientRect();
    scale=Math.max(1, Math.min(2, window.devicePixelRatio||1));
    canvas.width=Math.floor(rect.width*scale);
    canvas.height=Math.floor(rect.height*scale);
    W=rect.width; H=rect.height;
    ctx.setTransform(scale,0,0,scale,0,0);
    player.y=H-120;
    if(!running){
      player.x=W/2-player.w/2;
      player.targetX=player.x;
    }
  }
  window.addEventListener('resize',resize);
  resize();

  function roadBounds(){
    const rw=Math.min(W*.62, 330);
    return {left:(W-rw)/2,right:(W+rw)/2,width:rw};
  }

  function resetGame(){
    score=0; lives=3; objects.length=0; particles.length=0;
    roadOffset=0; spawnTimer=.6; collectibleTimer=.4;
    player.inv=0;
    const r=roadBounds();
    player.x=r.left+r.width/2-player.w/2;
    player.targetX=player.x;
    updateHUD();
  }

  function updateHUD(){
    scoreEl.textContent=Math.floor(score);
    livesEl.textContent=lives;
    highEl.textContent=highScore;
  }

  function startGame(){
    resetGame();
    running=true; paused=false; last=performance.now();
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    pauseBadge.classList.add('hidden');
    requestAnimationFrame(loop);
    beep(523,.08); setTimeout(()=>beep(659,.08),90); setTimeout(()=>beep(784,.12),180);
  }

  function endGame(){
    running=false;
    highScore=Math.max(highScore,Math.floor(score));
    localStorage.setItem('happyKidsRaceHigh',highScore);
    finalScoreEl.textContent=Math.floor(score);
    finalHighEl.textContent=highScore;
    updateHUD();
    gameOverOverlay.classList.remove('hidden');
    cheer();
  }

  function togglePause(){
    if(!running) return;
    paused=!paused;
    pauseBadge.classList.toggle('hidden',!paused);
    if(!paused){ last=performance.now(); requestAnimationFrame(loop); }
  }

  function spawnObstacle(){
    const r=roadBounds();
    const types=['cone','rock','car'];
    const type=types[Math.floor(Math.random()*types.length)];
    let w=type==='car'?50:40, h=type==='car'?78:42;
    objects.push({
      type, kind:'bad',
      x:r.left+16+Math.random()*(r.width-w-32),
      y:-h-10,w,h,
      speed:config[difficulty].speed*config[difficulty].enemySpeed*(.9+Math.random()*.25)
    });
  }

  function spawnCollectible(){
    const r=roadBounds();
    const types=['star','coin','gift'];
    const type=types[Math.floor(Math.random()*types.length)];
    objects.push({
      type, kind:'good',
      x:r.left+20+Math.random()*(r.width-60),
      y:-50,w:40,h:40,
      speed:config[difficulty].speed*(.85+Math.random()*.2)
    });
  }

  function rectHit(a,b){
    const pad=8;
    return a.x+pad < b.x+b.w-pad &&
           a.x+a.w-pad > b.x+pad &&
           a.y+pad < b.y+b.h-pad &&
           a.y+a.h-pad > b.y+pad;
  }

  function burst(x,y,emoji){
    for(let i=0;i<10;i++){
      particles.push({
        x,y,vx:(Math.random()-.5)*120,vy:(Math.random()-.7)*140,
        life:.7+Math.random()*.35,emoji
      });
    }
  }

  function update(dt){
    const cfg=config[difficulty];
    roadOffset=(roadOffset+cfg.speed*dt)%80;
    player.inv=Math.max(0,player.inv-dt);

    const r=roadBounds();
    const accel=420;
    if(keys.left) player.targetX-=accel*dt;
    if(keys.right) player.targetX+=accel*dt;
    player.targetX=Math.max(r.left+10,Math.min(r.right-player.w-10,player.targetX));
    player.x += (player.targetX-player.x)*Math.min(1,dt*10);

    spawnTimer-=dt;
    collectibleTimer-=dt;
    if(spawnTimer<=0){ spawnObstacle(); spawnTimer=cfg.spawn*(.8+Math.random()*.45); }
    if(collectibleTimer<=0){ spawnCollectible(); collectibleTimer=cfg.collect*(.8+Math.random()*.5); }

    for(let i=objects.length-1;i>=0;i--){
      const o=objects[i];
      o.y += o.speed*dt;
      if(o.y>H+100){ objects.splice(i,1); continue; }
      if(rectHit(player,o)){
        if(o.kind==='good'){
          const val=o.type==='star'?20:o.type==='coin'?10:35;
          score+=val;
          burst(o.x+o.w/2,o.y+o.h/2,o.type==='coin'?'🪙':o.type==='gift'?'🎁':'⭐');
          beep(o.type==='gift'?900:o.type==='star'?760:620,.08,'triangle',.035);
          objects.splice(i,1);
        }else if(player.inv<=0){
          lives--;
          player.inv=1.25;
          burst(player.x+player.w/2,player.y+player.h/2,'✨');
          beep(180,.18,'sawtooth',.045);
          objects.splice(i,1);
          if(lives<=0){ updateHUD(); endGame(); return; }
        }
      }
    }
    score += dt*3;
    updateHUD();

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
  }

  function drawBackground(){
    ctx.fillStyle='#78d7ff'; ctx.fillRect(0,0,W,H);

    // clouds
    ctx.fillStyle='rgba(255,255,255,.92)';
    for(const c of [[55,55,1],[W-80,95,.8],[90,175,.65]]){
      const [x,y,s]=c;
      ctx.beginPath();
      ctx.arc(x,y,18*s,0,Math.PI*2);
      ctx.arc(x+20*s,y-8*s,22*s,0,Math.PI*2);
      ctx.arc(x+42*s,y,17*s,0,Math.PI*2);
      ctx.fill();
    }

    // sun
    ctx.fillStyle='#ffd94a';
    ctx.beginPath(); ctx.arc(W-48,45,25,0,Math.PI*2); ctx.fill();

    // grass
    ctx.fillStyle='#76da68'; ctx.fillRect(0,120,W,H-120);

    const r=roadBounds();

    // roadside flowers/trees
    for(let y=-60;y<H+80;y+=90){
      const yy=((y+roadOffset*.65)% (H+120))-60;
      drawTree(Math.max(20,r.left-38),yy);
      drawTree(Math.min(W-20,r.right+38),yy+35);
    }

    // road
    ctx.fillStyle='#535b66';
    ctx.fillRect(r.left,0,r.width,H);

    // road edges
    ctx.fillStyle='#f7f7f7';
    ctx.fillRect(r.left,0,6,H);
    ctx.fillRect(r.right-6,0,6,H);

    // dashed center lane guides
    ctx.fillStyle='#fff6a7';
    const lanes=3;
    for(let l=1;l<lanes;l++){
      const x=r.left+r.width*l/lanes;
      for(let y=-80;y<H+80;y+=80){
        const yy=(y+roadOffset)% (H+160)-80;
        ctx.fillRect(x-3,yy,6,38);
      }
    }
  }

  function drawTree(x,y){
    ctx.fillStyle='#8a5b34';
    ctx.fillRect(x-4,y+24,8,18);
    ctx.fillStyle='#2fbf57';
    ctx.beginPath(); ctx.arc(x,y+18,16,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x-9,y+22,11,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+10,y+21,12,0,Math.PI*2); ctx.fill();
    ctx.font='14px sans-serif'; ctx.fillText('🌼',x-28,y+48);
  }

  function drawPlayer(){
    if(player.inv>0 && Math.floor(player.inv*10)%2===0) return;
    const x=player.x,y=player.y,w=player.w,h=player.h;
    ctx.save();
    ctx.translate(x,y);
    // wheels
    ctx.fillStyle='#263238';
    roundedRect(-5,16,10,22,5); ctx.fill();
    roundedRect(w-5,16,10,22,5); ctx.fill();
    roundedRect(-5,h-38,10,22,5); ctx.fill();
    roundedRect(w-5,h-38,10,22,5); ctx.fill();
    // body
    ctx.fillStyle=player.color;
    roundedRect(0,0,w,h,16); ctx.fill();
    ctx.fillStyle='#ffd8de';
    roundedRect(9,12,w-18,22,9); ctx.fill();
    ctx.fillStyle='#2e90c8';
    roundedRect(10,36,w-20,28,8); ctx.fill();
    ctx.fillStyle='#ffe066';
    ctx.beginPath(); ctx.arc(12,9,5,0,Math.PI*2); ctx.arc(w-12,9,5,0,Math.PI*2); ctx.fill();
    ctx.font='20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('😊',w/2,h-10);
    ctx.restore();
  }

  function drawObject(o){
    ctx.save();
    ctx.translate(o.x,o.y);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(o.type==='star'){ctx.font='38px sans-serif'; ctx.fillText('⭐',o.w/2,o.h/2);}
    if(o.type==='coin'){ctx.font='36px sans-serif'; ctx.fillText('🪙',o.w/2,o.h/2);}
    if(o.type==='gift'){ctx.font='36px sans-serif'; ctx.fillText('🎁',o.w/2,o.h/2);}
    if(o.type==='cone'){ctx.font='38px sans-serif'; ctx.fillText('🚧',o.w/2,o.h/2);}
    if(o.type==='rock'){ctx.font='38px sans-serif'; ctx.fillText('🪨',o.w/2,o.h/2);}
    if(o.type==='car'){
      ctx.font='52px sans-serif';
      ctx.fillText('🚙',o.w/2,o.h/2);
    }
    ctx.restore();
  }

  function drawParticles(){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.font='18px sans-serif';
      ctx.fillText(p.emoji,p.x,p.y);
    }
    ctx.globalAlpha=1;
  }

  function draw(){
    drawBackground();
    objects.forEach(drawObject);
    drawPlayer();
    drawParticles();
  }

  function loop(t){
    if(!running || paused) return;
    const dt=Math.min(.033,(t-last)/1000 || 0);
    last=t;
    update(dt);
    draw();
    if(running) requestAnimationFrame(loop);
  }

  // Controls
  function hold(btn,key){
    const down=e=>{e.preventDefault(); keys[key]=true;};
    const up=e=>{e.preventDefault(); keys[key]=false;};
    btn.addEventListener('pointerdown',down);
    btn.addEventListener('pointerup',up);
    btn.addEventListener('pointercancel',up);
    btn.addEventListener('pointerleave',up);
  }
  hold(document.getElementById('leftBtn'),'left');
  hold(document.getElementById('rightBtn'),'right');

  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft') keys.left=true;
    if(e.key==='ArrowRight') keys.right=true;
    if(e.code==='Space'){e.preventDefault(); togglePause();}
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft') keys.left=false;
    if(e.key==='ArrowRight') keys.right=false;
  });

  document.getElementById('startBtn').addEventListener('click',startGame);
  document.getElementById('restartBtn').addEventListener('click',startGame);
  document.getElementById('pauseBtn').addEventListener('click',togglePause);
  document.getElementById('soundBtn').addEventListener('click',e=>{
    soundOn=!soundOn;
    e.currentTarget.textContent=soundOn?'🔊':'🔇';
    e.currentTarget.classList.toggle('sound-on',soundOn);
    if(soundOn) beep(520,.08);
  });

  document.querySelectorAll('.difficulty button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.difficulty button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      difficulty=btn.dataset.level;
      beep(difficulty==='easy'?440:difficulty==='medium'?560:680,.06);
    });
  });

  draw();
})();
</script>
</body>
</html>
